server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- MISCONFIG #1: server-status page left open with no access
    # restriction. Real-world equivalent: nginx stub_status, Apache
    # server-status, or similar diagnostic endpoints left public. This
    # can leak internal IPs, request patterns, and uptime that helps
    # correlate the hidden service to its origin server. ---
    location /server-status {
        stub_status on;
        allow all;
    }

    # --- MISCONFIG #2: a default/leftover banner revealing the exact
    # server software + version, useful for infra fingerprinting ---
    add_header X-Powered-By "nginx/1.25.3 (Ubuntu)" always;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- MISCONFIG #3 (the big one): this SSL certificate is REUSED
    # on the clearnet-twin site (see nginx-clearnet/). Reusing a cert
    # across a hidden service and a real-world domain is one of the
    # most common deanonymization vectors in practice — the cert's
    # fingerprint links the two directly. ---
    ssl_certificate     /etc/nginx/certs/shared_cert.pem;
    ssl_certificate_key /etc/nginx/certs/shared_key.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}
