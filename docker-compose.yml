version: "3.8"

# =========================================================================
# SIH26151 — Threat Actor Attribution Assistance Platform Infrastructure
# Hardened container orchestration with pinned digests, health checks,
# and egress controls.
# =========================================================================

services:

  # --- Canonical Relational Database (PostgreSQL 16) ---
  postgres:
    image: postgres:16-alpine
    container_name: sih-postgres
    environment:
      POSTGRES_DB: darkweb_intel
      POSTGRES_USER: darkweb
      POSTGRES_PASSWORD: changeme_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - lab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkweb -d darkweb_intel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Immutable Raw Artifact Storage (MinIO) ---
  minio:
    image: minio/minio:RELEASE.2024-01-31T02-40-02Z
    container_name: sih-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: changeme_in_production
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - lab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Hidden Service #1: nginx-hidden (Vulnerable test host) ---
  nginx-hidden:
    build: ./nginx-hidden
    container_name: nginx-hidden
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - lab-net
    expose:
      - "80"
      - "443"

  # --- Clearnet Twin: nginx-clearnet ---
  nginx-clearnet:
    build: ./nginx-clearnet
    container_name: nginx-clearnet
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - lab-net
    ports:
      - "8443:443"

  # --- Mock Marketplace App ---
  marketplace:
    build: ./marketplace
    container_name: marketplace
    volumes:
      - ./sample_data:/app/data:ro
    networks:
      - lab-net
    expose:
      - "5000"

  # --- Tor Daemon Service ---
  tor:
    build: ./tor
    container_name: tor-daemon
    depends_on:
      - nginx-hidden
      - marketplace
    volumes:
      - tor-hidden-data:/var/lib/tor
    networks:
      - lab-net
      - scanner-net   # reachable by the isolated OnionScan container
    ports:
      - "9050:9050"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- OnionScan (Branch 4): isolated, non-root, pinned OPSEC scanner ---
  # NOT started by default (profile "scan"); no live scanning unless invoked, e.g.:
  #   docker compose --profile scan run --rm onionscan --torProxyAddress tor:9050 <target>.onion
  onionscan:
    # EC-31: pin the upstream artifact. Replace the tag with the sha256 digest
    # recorded in docs/sbom.md before any production/live use:
    #   image: nao1215/onionscan@sha256:<digest-from-docs/sbom.md>
    image: nao1215/onionscan:1.0.0
    container_name: sih-onionscan
    profiles: ["scan"]        # excluded from `docker compose up` — no live scan by default
    depends_on:
      - tor
    environment:
      # Route all scanner traffic through the Tor SOCKS proxy only.
      TOR_PROXY_ADDRESS: "tor:9050"
    networks:
      - scanner-net          # internal-only: can reach Tor, but has NO egress
    user: "1000:1000"        # non-root
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  lab-net:
    driver: bridge
    internal: false   # Egress restricted via firewall / policy rules
  scanner-net:
    driver: bridge
    internal: true    # no external egress; OnionScan reaches only Tor on this net

volumes:
  postgres-data:
  minio-data:
  tor-hidden-data:
