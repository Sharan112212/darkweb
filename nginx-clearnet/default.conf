server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SAME certificate as nginx-hidden — this is the deliberate leak.
    # A real admin reused a cert (or generated one from the same CSR/
    # key pair) across their public company site and their hidden
    # service, letting the two be correlated by certificate fingerprint.
    ssl_certificate     /etc/nginx/certs/shared_cert.pem;
    ssl_certificate_key /etc/nginx/certs/shared_key.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
