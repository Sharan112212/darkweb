mode: fixture_replay    # fixture_replay | authorized_tor | authorized_clearnet
kill_switch: false
default_timeout_seconds: 30
max_response_bytes: 10485760   # 10 MB
max_retries: 2
retry_backoff_seconds: 5
request_delay_seconds: 2
per_host_concurrency: 1
mime_allowlist:
  - text/html
  - application/json
  - text/plain
